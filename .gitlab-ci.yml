image: eclipse-temurin:17-jdk

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_SDK_TOOLS: "11076708"

before_script:
  # Cài đặt Node.js & Android SDK
  - apt-get update -y && apt-get install -y wget unzip curl git
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs
  - export ANDROID_HOME="${PWD}/android-sdk"
  - mkdir -p "${ANDROID_HOME}/cmdline-tools"
  - wget -q https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip -O cmdline-tools.zip
  - unzip -q cmdline-tools.zip -d "${ANDROID_HOME}/cmdline-tools"
  - mv "${ANDROID_HOME}/cmdline-tools/cmdline-tools" "${ANDROID_HOME}/cmdline-tools/latest"
  - rm cmdline-tools.zip
  - export PATH="${PATH}:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools"
  - yes | sdkmanager --licenses > /dev/null || true
  - sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null

build_apk:
  stage: build
  script:
    - npm ci
    - npm run build
    - npx cap sync android
    - cd android
    - chmod +x gradlew
    - ./gradlew assembleDebug
  artifacts:
    name: "gym-todo-app-debug"
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
    expire_in: 1 week
  only:
    - main